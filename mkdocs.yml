site_name: GoAuth
site_description: OAuth 2.0, JWT, and multi-provider authentication for Go — including DPoP (RFC 9449)
site_url: https://grokify.github.io/goauth/
repo_url: https://github.com/grokify/goauth
repo_name: grokify/goauth

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

markdown_extensions:
  - tables
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Guides:
      - DPoP (RFC 9449): guides/dpop.md
      - Google: google.md
  - Releases:
      - v0.24.0: releases/v0.24.0.md
  - Changelog: changelog.md
